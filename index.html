<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/application.css">
    <title>Image Assigner</title>
</head>
<body>

    <!-- Header section -->
    <header>
        <div class="header-items">
            <h1>JS Array Image Generator</h1>
        </div>
    </header>

    <!-- Image generator section -->
    <div class="image-generator">
        <div class="image-items">
            <input type="text" id="search" placeholder="Search for an image">
            <button id="imageGenerator">Generate an image!</button>
        </div>

        <!-- Where generated image will show -->
        <div id="image-container"></div>
    </div>

    <!-- Email form section -->
    <div class="forms">
        <div class="form-items">
            <form name="emailForm" id="emailForm">
                
                <input type="email" name="email" placeholder="Email Address" required>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <div class="saveButton">
        <button id="save-image">Save Image</button>
    </div>

    <div id="saved-images">
        <h2>Images saved for email</h2>
        <div id="image-list"></div>
    </div>

    <!-- Footer section -->
    <footer>
        <div class="footer">
            <h2>Image Generator made using <a href="https://unsplash.com/developers" target="_blank">Unsplash API</a></h2>
            <img src="assets/cover.webp" alt="Image for Unsplash API">
        </div>
    </footer>

    <!-- Javascript Files -->
    <script src="jquery-4.0.0.min.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/database.js"></script>
    <script src="js/unsplash.js"></script>
</body>
</html>
