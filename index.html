<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/application.css">
    <title>Image Assigner</title>
</head>
<body>

    <div class="page-content">
        <!-- Alert Box -->
        <div id="message-box"></div>

        <!-- Header section -->
        <header>
            <div class="header-items">
                <h1>Image Generator</h1>
            </div>
        </header>

            <!-- Email form section -->
        <div class="forms">
            <div class="form-items">
                <form name="emailForm" id="emailForm">
                    <input type="email" name="email" placeholder="Email Address">
                    <button type="submit">Submit</button>
                </form>
            </div>
        </div>

            <!-- Image generator section -->
        <div class="image-generator">
            <div class="image-items">
            <form>
                <input type="text" id="search" placeholder="Search for an image">
                <button type="submit" id="imageGenerator">Generate an image!</button>
            </form>
        </div>

        <div class="saveButton">
            <button id="save-image">Save Image</button>
        </div>

            <!-- Where generated image will show -->
            <div id="image-container"></div>
        </div>

        <div id="saved-images">
            <h2>Images saved for email</h2>
            <div id="image-list"></div>
        </div>
    </div>

    <!-- Javascript Files -->
    <script src="jquery-4.0.0.min.js"></script>
    <script src="js/message.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/database.js"></script>
    <script src="js/unsplash.js"></script>
</body>
</html>
